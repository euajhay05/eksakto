<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eksakto</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#13221A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Eksakto">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --bg:#F3F5F0;
    --sidebar:oklch(1 0 0);
    --panel:oklch(1 0 0);
    --panel2:oklch(0.97 0.006 150);
    --card:oklch(0.97 0.006 150);
    --card2:oklch(0.96 0.01 150);
    --border:oklch(0 0 0 / 0.07);
    --border2:oklch(0 0 0 / 0.05);
    --border3:oklch(0 0 0 / 0.08);
    --text:#13221A;
    --text-dim:oklch(0.45 0.015 150);
    --text-dim2:oklch(0.48 0.015 150);
    --text-dim3:oklch(0.5 0.015 150);
    --text-dim4:oklch(0.55 0.015 150);
    --accent1:#1F6F47;
    --accent2:#14502F;
    --accent-on:oklch(1 0 0);
    --teal:oklch(0.55 0.12 175);
    --danger:#B5532A;
    --warn:oklch(0.58 0.16 80);
    --good:oklch(0.5 0.15 150);
    --pending:oklch(0.62 0.17 45);
    --track:oklch(0.91 0.012 150);
    --track2:oklch(0.89 0.012 150);
    --tint:#E3EBDF;
    --brand-deep:#14502F;
    --brand:#1F6F47;
    --gold:#E8A33D;
    --line:#DCE3D7;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);font-family:'Manrope',system-ui,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:oklch(0.8 0.015 150);border-radius:8px}
  ::-webkit-scrollbar-track{background:transparent}

  .app-shell{display:flex;height:100vh;width:100%;overflow:hidden}
  .sidebar{width:220px;flex:none;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:24px 16px;gap:28px;overflow-y:auto}
  .logo-wrap{display:flex;align-items:center;gap:9px;padding:0 8px}
  .logo-badge{background:#E8A33D;border:0;border-radius:12px;padding:8px 14px;display:flex;align-items:center;justify-content:center;color:#13221A;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:15px;letter-spacing:-0.01em;flex:none}
  .logo-hamburger{all:unset;cursor:pointer;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;width:30px;height:30px;flex:none;border-radius:8px}
  .logo-hamburger:hover{background:var(--card)}
  .logo-hamburger span{display:block;width:15px;height:2px;background:var(--text-dim2);border-radius:2px}
  @media (min-width: 861px){
    .sidebar.collapsed{width:68px;padding:24px 10px}
    .sidebar.collapsed .logo-wrap{justify-content:center}
    .sidebar.collapsed .logo-wrap .logo-badge{display:none}
    .sidebar.collapsed .nav-section{display:none}
    .sidebar.collapsed .nav-btn{justify-content:center;padding:10px 0}
    .sidebar.collapsed .nav-btn .nav-label{display:none}
  }
  nav.navlist{display:flex;flex-direction:column;gap:4px}
  .nav-section{font-size:10.5px;font-weight:700;color:var(--text-dim4);letter-spacing:0.06em;text-transform:uppercase;padding:14px 12px 4px}
  .nav-btn{all:unset;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;font-size:14px;font-weight:500;cursor:pointer}
  .nav-btn .ic{width:18px;text-align:center;display:inline-flex;align-items:center;justify-content:center;font-size:17px;flex:none}

  .main{flex:1;overflow-y:auto;padding:32px 40px}
  .page-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:24px;gap:16px;flex-wrap:wrap}
  .page-title{font-family:'Bricolage Grotesque',sans-serif;font-size:26px;font-weight:700;letter-spacing:-0.01em}
  .page-sub{color:var(--text-dim);font-size:14px;margin-top:4px}
  .sg{font-family:'Bricolage Grotesque',sans-serif}

  .card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:22px}
  .card-title{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:16px;margin-bottom:16px}

  .btn-primary{all:unset;cursor:pointer;padding:10px 16px;border-radius:9px;background:var(--accent1);color:var(--accent-on);font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px}
  .btn-danger{all:unset;cursor:pointer;padding:11px 16px;border-radius:9px;background:oklch(0.92 0.08 25);color:oklch(0.5 0.19 25);font-weight:600;font-size:13.5px}
  .btn-ghost{all:unset;cursor:pointer;color:var(--text-dim2)}
  .btn-telegram{all:unset;cursor:pointer;display:flex;align-items:center;gap:6px;padding:10px 16px;border-radius:9px;background:oklch(0.55 0.14 235 / 0.14);color:oklch(0.5 0.15 235);font-weight:600;font-size:13px}

  .field label{font-size:12px;color:var(--text-dim2);font-weight:600;display:block;margin-bottom:6px}
  .field input, .field select, .field textarea{width:100%;box-sizing:border-box;background:var(--card);border:1px solid var(--border3);border-radius:9px;padding:10px 12px;color:inherit;font-size:14px;font-family:inherit}
  .field textarea{resize:vertical;line-height:1.5;min-height:64px}
  .field{flex:1}

  .search-wrap{position:relative;margin-bottom:16px}
  .search-wrap input{width:100%;box-sizing:border-box;background:var(--panel2);border:1px solid var(--border3);border-radius:10px;padding:11px 40px 11px 14px;color:inherit;font-size:14px;font-family:inherit}
  .search-clear{all:unset;cursor:pointer;position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--text-dim2);font-size:14px}

  .tabbar{display:flex;gap:4px;background:var(--panel2);border-radius:10px;padding:4px;width:fit-content}
  .tab-btn{all:unset;cursor:pointer;padding:8px 16px;border-radius:7px;font-size:13px;font-weight:600}

  .table-wrap{background:var(--panel);border:1px solid var(--border);border-radius:16px;overflow:hidden}
  .t-head{display:grid;padding:14px 20px;color:var(--text-dim3);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.03em;border-bottom:1px solid var(--border)}
  .t-row{display:grid;padding:14px 20px;align-items:center;border-bottom:1px solid var(--border2)}

  .badge{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.03em;padding:3px 7px;border-radius:6px;display:inline-block}

  .progress{height:8px;background:var(--track);border-radius:5px;overflow:hidden}
  .progress > div{height:100%;border-radius:5px}

  .modal-backdrop{position:fixed;inset:0;background:oklch(0 0 0 / 0.6);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:50}
  .modal-backdrop.chip{z-index:60}
  .modal-box{width:460px;max-width:92vw;max-height:88vh;overflow-y:auto;background:var(--panel2);border:1px solid oklch(0 0 0 / 0.09);border-radius:18px;padding:26px}
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
  .modal-title{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:17px}
  .modal-close{all:unset;cursor:pointer;color:var(--text-dim2);font-size:18px;padding:4px}
  .modal-fields{display:flex;flex-direction:column;gap:14px}
  .row-2{display:flex;gap:12px}
  .modal-actions{display:flex;gap:10px;margin-top:20px}

  .kanban-scroll{display:flex;gap:16px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
  .kanban-col{width:260px;flex:none;background:var(--panel2);border-radius:14px;padding:14px}
  .kanban-col-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;padding:0 4px}
  .shoot-card{background:var(--card);border:1px solid oklch(0 0 0 / 0.06);border-radius:11px;padding:13px;cursor:grab}

  .cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
  .cal-cell{min-width:0;overflow:hidden;aspect-ratio:1;border-radius:9px;padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px;cursor:pointer}

  select{appearance:none;-webkit-appearance:none}
  input::placeholder{color:oklch(0.55 0.015 150)}

  .mobile-topbar{display:none;align-items:center;gap:12px;padding:12px 16px;background:var(--sidebar);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:30}
  .hamburger-btn{all:unset;cursor:pointer;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;width:36px;height:36px;flex:none;border-radius:9px;background:var(--card)}
  .hamburger-btn span{display:block;width:16px;height:2px;background:var(--text);border-radius:2px}
  .sidebar-backdrop{position:fixed;inset:0;background:oklch(0 0 0 / 0.55);z-index:39}

  @media (max-width: 860px){
    .app-shell{flex-direction:column;height:auto;min-height:100vh}
    .mobile-topbar{display:flex}
    .sidebar{position:fixed;top:0;left:0;bottom:0;z-index:40;transform:translateX(-100%);transition:transform 0.2s ease-out;box-shadow:4px 0 24px oklch(0 0 0 / 0.4)}
    .sidebar.open{transform:translateX(0)}
    .logo-hamburger{display:none}
    .main{padding:20px 16px;width:100%}
    .table-wrap{overflow-x:auto}
    .t-head,.t-row{min-width:520px}
    .modal-box{width:420px}
    .dash-hero-grid{grid-template-columns:1fr !important}
    [data-picker-popover]{position:fixed !important;left:12px !important;right:12px !important;top:auto !important;bottom:calc(12px + env(safe-area-inset-bottom,0px)) !important;width:auto !important;max-width:none !important;min-width:0 !important;max-height:70vh;max-height:70svh;overflow-y:auto;overscroll-behavior:contain;z-index:140 !important}
  }

  /* ---- Settings ---- */
  .set-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:18px;align-items:start}
  .set-grid .card{display:flex;flex-direction:column;gap:14px}
  .set-grid .card-title{margin-bottom:0}
  .set-wide{grid-column:1/-1}
  .set-sub{font-size:13px;color:var(--text-dim);line-height:1.5;margin-top:-8px}
  .set-logo{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .set-rows{display:flex;flex-direction:column;gap:10px}
  .set-row{display:flex;gap:10px;align-items:flex-end}
  .set-row .field{min-width:0}
  .set-del{all:unset;cursor:pointer;flex:none;width:40px;height:40px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--text-dim);border:1px solid var(--border3)}
  .set-del:hover{color:var(--danger);border-color:var(--danger)}
  .set-chip{all:unset;cursor:pointer;flex:none;height:40px;padding:0 12px;border-radius:9px;font-size:12.5px;font-weight:700;background:var(--tint);color:var(--brand-deep)}
  .set-grid .btn-ghost{align-self:flex-start;padding:9px 14px;border-radius:9px;border:1px solid var(--border3);font-weight:600;font-size:13px;color:var(--text);display:inline-flex;align-items:center;gap:6px}
  .set-grid .btn-ghost:hover{border-color:var(--accent1);color:var(--accent1)}
  .set-toggles{display:flex;flex-direction:column;gap:8px}
  .set-toggle{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 14px;border:1px solid var(--border3);border-radius:12px}
  .set-toggle b{display:block;font-size:14px}
  .set-toggle small{display:block;font-size:12.5px;color:var(--text-dim);margin-top:2px}
  .set-toggle .sw{flex:none;width:40px;height:24px;border-radius:99px;background:var(--track2);position:relative;transition:background .15s}
  .set-toggle .sw span{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .set-toggle .sw.on{background:var(--accent1)}
  .set-toggle .sw.on span{left:19px}
  .set-toggle:focus-visible,.set-del:focus-visible,.set-chip:focus-visible{outline:3px solid rgba(31,111,71,.35);outline-offset:2px}
  @media (max-width:560px){.set-row{flex-wrap:wrap}.set-row .field{flex:1 1 40%}}
  .set-row > input{flex:1;min-width:0}
  .set-pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
  .set-pairs .field{margin:0}
  .set-pairs label{font-size:11.5px;color:var(--text-dim)}
  .set-blanks{display:flex;flex-wrap:wrap;gap:6px;margin-top:-4px}
  .set-blanks code{font-family:'Manrope',system-ui,sans-serif;font-size:12.5px;font-weight:600;padding:4px 9px;border-radius:99px;background:var(--tint);color:var(--brand-deep)}
  .set-docs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}
  .set-docs .field{margin:0}
  .set-grid .btn-link{align-self:flex-start}
  .set-lang{display:flex;flex-direction:column;gap:16px}
  .lang-head{display:flex;align-items:center;gap:12px}
  .lang-ic{width:40px;height:40px;border-radius:12px;background:var(--tint);color:var(--brand);display:flex;align-items:center;justify-content:center;flex:none}
  .set-lang .card-title{font-size:20px}
  .lang-choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .lang-choice{all:unset;box-sizing:border-box;cursor:pointer;border-radius:14px;padding:16px;background:var(--ground);color:var(--ink);display:flex;flex-direction:column;gap:4px;min-width:0}
  .lang-choice b{font-size:16px;font-weight:800}
  .lang-choice small{font-size:13px;color:var(--mut)}
  .lang-choice.on{background:var(--night);color:var(--night-text)}
  .lang-choice.on small{color:var(--night-mut)}
  .lc-top{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:20px}
  .lc-check{width:20px;height:20px;border-radius:999px;background:var(--gold);color:var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
  .lang-sep{height:1px;background:var(--line)}
  .lang-doc{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .ld-text{flex:1 1 220px;min-width:0}
  .ld-text b{display:block;font-weight:800;font-size:14px}
  .ld-text small{display:block;font-size:13px;color:var(--mut);margin-top:2px}
  .lang-seg{display:flex;background:var(--ground);border-radius:12px;padding:4px}
  .lang-seg button{all:unset;box-sizing:border-box;cursor:pointer;height:38px;padding:0 14px;border-radius:9px;color:var(--mut);font-weight:700;font-size:13px;display:flex;align-items:center}
  .lang-seg button.on{background:var(--surface);color:var(--ink);font-weight:800;box-shadow:0 1px 3px rgba(19,34,26,.12)}
  .lang-choice:focus-visible,.lang-seg button:focus-visible,.su-lang button:focus-visible{outline:3px solid rgba(31,111,71,.35);outline-offset:2px}
  .su-lang{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:4px}
  .su-lang button{all:unset;box-sizing:border-box;cursor:pointer;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);font-size:13.5px;font-weight:700;color:var(--mut);display:flex;align-items:center}
  .su-lang button.on{background:var(--ink);border-color:var(--ink);color:var(--night-text)}
  .btn-link.auth-lang{font-size:13px;font-weight:700;min-height:44px;padding:0 4px;display:inline-flex;align-items:center}
  .set-starter{flex-direction:row !important;align-items:center;justify-content:space-between;flex-wrap:wrap}
  .set-starter > div:first-child{flex:1 1 320px;display:flex;flex-direction:column;gap:14px}
  .set-presets{display:flex;gap:10px;flex-wrap:wrap}
  .set-preset{all:unset;cursor:pointer;box-sizing:border-box;display:flex;align-items:center;gap:12px;padding:12px 16px;border:1px solid var(--border3);border-radius:14px;min-width:220px;color:var(--brand)}
  .set-preset:hover{border-color:var(--brand);background:var(--tint)}
  .set-preset b{display:block;font-size:14px;color:var(--text)}
  .set-preset small{display:block;font-size:12px;color:var(--text-dim);margin-top:2px}
  .set-confirm{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border-radius:14px;background:var(--tint);font-size:13.5px;max-width:460px}
  .set-preset:focus-visible{outline:3px solid rgba(31,111,71,.35);outline-offset:2px}
  @media (max-width:560px){.set-pairs{grid-template-columns:1fr 1fr}.set-preset{flex:1 1 100%;min-width:0}}

  /* ================= Eksakto redesign (night band + tinted ground) ================= */
  :root{
    --ground:#F3F5F0;--surface:#FFFFFF;--ink:#13221A;--mut:#4F6357;--line:#DCE3D7;--tint:#E3EBDF;
    --brand:#1F6F47;--brand-deep:#14502F;--night:#13221A;--night-text:#F3F5F0;--night-mut:#B7C7BB;
    --night-in:#1E3327;--night-line:#2E4437;--gold:#E8A33D;--warm:#FBF1DD;--warm-text:#6B460C;--danger:#B5532A;
    --bg:#F3F5F0;--panel:#FFFFFF;--panel2:#FFFFFF;--card:#F3F5F0;--card2:#F3F5F0;
    --border:#DCE3D7;--border2:#E8EDE4;--border3:#DCE3D7;
    --text:#13221A;--text-dim:#4F6357;--text-dim2:#4F6357;--text-dim3:#4F6357;--text-dim4:#7A8B80;
    --accent1:#1F6F47;--accent2:#14502F;
    --display:'Bricolage Grotesque','Manrope',system-ui,sans-serif;
    --body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
    --vw:100vw;
  }
  html{background:var(--ground)}
  body{background:var(--ground);font-family:var(--body);color:var(--ink);font-feature-settings:"tnum" 1;letter-spacing:-0.003em}
  .sg{font-family:var(--display) !important;font-variant-numeric:tabular-nums;letter-spacing:-0.01em}
  .app-shell{display:block !important;height:auto !important;min-height:100vh;overflow:visible !important;overflow-x:clip !important}
  .mobile-topbar,.sidebar,.sidebar-backdrop{display:none !important}
  .ico{flex:none;display:block}
  .main{max-width:1304px;margin:0 auto;overflow:visible !important;padding:0 32px 72px !important}
  input,select,textarea,button{font-family:inherit}

  /* ---- top header (night) ---- */
  .topbar{position:sticky;top:0;z-index:60;background:var(--night);color:var(--night-text)}
  .tb-in{max-width:1304px;margin:0 auto;padding:18px 32px;display:flex;align-items:center;gap:16px}
  .tb-logo{all:unset;cursor:pointer;font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-0.6px;color:var(--night-text);flex:none;line-height:1}
  .tb-logo span{color:var(--gold)}
  .tb-logo:focus-visible{outline:3px solid rgba(232,163,61,.5);outline-offset:4px;border-radius:6px}
  nav.dock{display:flex;gap:4px;margin-left:24px;flex-wrap:nowrap;min-width:0;overflow-x:auto;scrollbar-width:none}
  nav.dock::-webkit-scrollbar{display:none}
  .dk{all:unset;cursor:pointer;flex:none;font-family:Manrope,system-ui,sans-serif;color:var(--night-mut);font-weight:600;font-size:14px;letter-spacing:0;padding:10px 16px;border-radius:999px;white-space:nowrap}
  .dk .ico{display:none}
  .dk:hover{color:var(--night-text);background:rgba(243,245,240,.08)}
  .dk.on{background:var(--night-text);color:var(--ink);font-weight:700}
  .dk:focus-visible{outline:3px solid rgba(232,163,61,.5);outline-offset:2px}
  .tb-grow{flex:1 1 auto}
  .tb-search{position:relative;flex:0 1 268px;min-width:180px;display:flex;align-items:center;gap:10px;padding:0 14px;height:44px;border-radius:14px;background:var(--night-in);color:var(--night-mut)}
  .tb-search input{all:unset;flex:1;font-size:14px;color:var(--night-text);min-width:0}
  .tb-search input::placeholder{color:#8FA597}
  .tb-results{position:absolute;left:0;right:0;top:52px;min-width:300px;background:#fff;border-radius:18px;box-shadow:0 22px 60px rgba(19,34,26,.25);padding:6px;display:flex;flex-direction:column;z-index:70;color:var(--ink)}
  .tb-results button{all:unset;cursor:pointer;display:flex;gap:12px;align-items:center;padding:10px;border-radius:12px;color:var(--ink)}
  .tb-results button:hover{background:var(--ground)}
  .tb-results b{display:block;font-size:14px}.tb-results small{font-size:12px;color:var(--mut)}

  .chart-night{background:var(--night) !important;color:var(--night-text);box-shadow:none !important}

  .mini-bars{display:flex;align-items:flex-end;gap:10px;height:120px}
  .mini-bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
  .mini-bars i{display:block;width:100%;background:var(--night-line);border-radius:6px;min-height:4px}
  .mini-bars i.cur{background:var(--gold)}
  .mini-bars span{font-size:11px;color:var(--night-mut)}
  .mini-bars span.cur{color:var(--night-text);font-weight:800}

  /* ---- Shoots board ---- */
  .kanban-scroll{display:flex;gap:16px !important;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
  .kanban-col{width:auto !important;flex:1 0 228px;max-width:300px;background:transparent !important;border:0 !important;padding:0 !important}

  .kanban-col-head{display:flex;align-items:center;gap:8px;margin-bottom:12px !important;padding:0 4px}
  .kc-dot{width:9px;height:9px;border-radius:50%;flex:none}
  .kc-label{font-weight:800;font-size:16px}
  .kc-count{font-size:12px;font-weight:800;color:var(--mut);background:#E8EDE4;border-radius:999px;padding:2px 8px}
  .kc-empty{border:2px dashed var(--line);border-radius:18px;padding:22px 16px;text-align:center;font-size:13px;color:var(--mut)}
  .shoot-card{background:#fff !important;border:0 !important;border-radius:18px !important;padding:16px !important;display:flex;flex-direction:column;gap:6px;cursor:grab;box-shadow:0 1px 0 var(--line);overflow-wrap:anywhere;min-width:0;transition:box-shadow .15s,transform .15s}

  .shoot-card.done{background:var(--tint) !important;box-shadow:none}
  .sc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .sc-top b{font-size:16px;font-weight:800;line-height:1.25}
  .sc-meta{font-size:13px;color:var(--mut)}
  .sc-money{display:flex;flex-direction:column;gap:10px;margin-top:6px;padding-top:12px;border-top:1px solid #E8EDE4}
  .sc-money .bar{margin:0;width:100%}
  .sc-amt{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .sc-amt b{font-size:16px;font-weight:800}
  .sc-bal{font-size:12.5px;font-weight:800;color:#8A5A10;white-space:nowrap}
  .sc-bal.paid{color:var(--brand-deep)}.sc-bal.late{color:var(--danger)}.sc-bal.none{color:var(--mut)}
  @media (min-width:761px){ .sc-amt b{white-space:nowrap;flex:none} .sc-amt .sc-bal{white-space:normal;text-align:right;min-width:0;line-height:1.25} }
  .sc-foot{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;color:var(--mut)}
  .sc-move{all:unset;cursor:pointer;font-size:12px;font-weight:800;color:var(--brand);padding:4px 8px;border-radius:8px}
  .sc-move:hover{background:var(--tint)}

  /* ---- Payments ---- */
  .pay-wrap{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start}
  .pay-main-col{flex:999 1 560px;min-width:0}
  .pay-side-col{flex:1 1 320px;min-width:0}
  .pay-list{display:flex;flex-direction:column;gap:10px}
  .pay-row{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:14px;background:var(--ground)}
  .pay-row.late{background:#FFF4EF;box-shadow:inset 0 0 0 1px #F2C9B6}
  .pay-main{all:unset;cursor:pointer;flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .pay-main b{font-size:16px;font-weight:800}
  .pay-main:hover b{color:var(--brand-deep)}
  .pay-main small{font-size:13px;color:var(--mut)}
  .pay-main small.late{color:var(--danger);font-weight:800}
  .pay-progress{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mut);margin-top:6px}
  .pay-progress .bar{margin-top:0;width:min(260px,60%)}
  .pay-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .pay-chip{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--tint);color:var(--brand-deep)}
  .pay-chip.old{background:#E8EDE4;color:var(--mut)}
  .pay-none{font-size:12px;color:var(--mut)}
  .pay-reminded{font-size:12px;font-weight:700;color:var(--brand);margin-top:4px}
  .pay-side{flex:none;text-align:right;display:flex;align-items:center;gap:12px}
  .pay-side .num{display:flex;flex-direction:column;align-items:flex-end}
  .pay-bal{font-size:16px;font-weight:800;color:var(--ink)}.pay-bal.paid{color:var(--brand)}
  .pay-side small{font-size:12px;color:var(--mut)}
  .pay-btns{display:flex;gap:8px}
  .pay-btn{height:42px}
  .recent-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #E8EDE4}
  .recent-row:last-child{border-bottom:0}
  .recent-row .ic{width:36px;height:36px;border-radius:12px;background:var(--tint);color:var(--brand);display:flex;align-items:center;justify-content:center;flex:none}
  .recent-row .num{margin-left:auto;font-weight:800;color:var(--brand);font-size:16px;white-space:nowrap}
  .fchips{display:flex;gap:8px}
  .fchips button{all:unset;cursor:pointer;white-space:nowrap;height:36px;padding:0 12px;border-radius:999px;background:var(--ground);font-weight:800;font-size:13px;color:var(--mut);display:inline-flex;align-items:center}
  .fchips button.on{background:var(--night);color:var(--night-text)}

  /* ---- Clients ---- */
  .cl-wrap{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start}
  .cl-table{flex:999 1 560px;min-width:0;background:#fff;border-radius:18px;box-shadow:0 1px 0 var(--line);padding:8px}
  .cl-head,.cl-row{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.2fr) 70px minmax(0,1fr);gap:12px;align-items:center;padding:12px 14px}
  .cl-head{font-size:12px;font-weight:800;color:var(--mut);letter-spacing:.6px;text-transform:uppercase;padding-top:16px}
  .cl-head span:last-child,.cl-row .tot{text-align:right}
  .cl-row{all:unset;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.2fr) 70px minmax(0,1fr);gap:12px;align-items:center;padding:12px 14px;border-radius:14px;cursor:pointer;width:100%}
  .cl-row:hover,.cl-row.on{background:var(--ground)}
  .cl-row:focus-visible{outline:3px solid rgba(31,111,71,.35)}
  .cl-who{display:flex;align-items:center;gap:12px;min-width:0}
  .cl-who b{display:block;font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cl-who small{display:block;font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cl-row .tot{font-weight:800;font-size:16px}.cl-row .tot.none{color:var(--mut)}
  .cl-row .cnt{font-weight:800}
  .cl-detail{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:14px}
  .cl-detail .who{display:flex;align-items:center;gap:14px}
  .cl-detail .who .avatar{width:56px;height:56px;font-size:22px}
  .cl-detail h3{margin:0;font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-0.4px;line-height:1.1}
  .cl-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .cl-stats div{border-radius:14px;padding:12px 14px;background:var(--tint)}
  .cl-stats div.warm{background:var(--warm)}
  .cl-stats small{display:block;font-size:12px;font-weight:800;color:var(--brand-deep)}
  .cl-stats div.warm small{color:var(--warm-text)}
  .cl-stats b{display:block;font-family:var(--display);font-weight:800;font-size:24px}
  .cl-shoot{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:12px;background:var(--ground);font-weight:800;font-size:14px;cursor:pointer}
  @media (max-width:1100px){ .cl-detail{display:none} }

  /* ---- Docs ---- */
  .doc-tiles{flex-basis:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:6px}
  .doc-tile{all:unset;cursor:pointer;box-sizing:border-box;background:#1E3327;border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:6px;color:var(--night-text);border:2px solid transparent}
  .doc-tile:hover{background:#243B2E}
  .doc-tile.on{border-color:var(--gold)}
  .doc-tile .ic{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;background:var(--night-text);color:var(--ink)}
  .doc-tile .ic.gold{background:var(--gold);color:var(--ink)}.doc-tile .ic.green{background:var(--brand);color:#fff}
  .doc-tile b{font-size:18px;font-weight:800}
  .doc-tile small{font-size:13.5px;color:var(--night-mut)}
  .doc-tile:focus-visible{outline:3px solid rgba(232,163,61,.5)}
  #doc-preview-panel{border:0 !important;border-radius:18px !important;box-shadow:0 18px 50px rgba(19,34,26,.10)}

  .cal-cell{aspect-ratio:auto !important;min-height:66px;border-radius:12px !important}
  @media (max-width:760px){ .cal-cell{min-height:44px} }
  /* ---- Calendar ---- */
  .cal-wrap{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start}
  .bc{flex:999 1 620px;min-width:min(100%,320px);padding:20px !important}
  .bc-side{flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:16px}
  .bc-day{background:var(--night);color:var(--night-text);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:6px}
  .bc-day .eyebrow{font-size:13px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--gold)}
  .bc-day h3{margin:4px 0 6px;font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:-0.5px;line-height:1.1}
  .bc-day .meta{font-size:14px;color:var(--night-mut)}
  .bc-day .gold{font-size:14px;font-weight:800;color:var(--gold)}
  .bc-day .acts{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
  .bc-day .btn-light{all:unset;cursor:pointer;height:44px;padding:0 20px;border-radius:12px;background:var(--night-text);color:var(--ink);font-weight:800;font-size:14.5px;display:inline-flex;align-items:center}
  .bc-day .btn-line{all:unset;cursor:pointer;height:44px;padding:0 20px;border-radius:12px;border:1px solid var(--night-line);color:var(--night-text);font-weight:800;font-size:14.5px;display:inline-flex;align-items:center;box-sizing:border-box}
  .bc-day .more{border-top:1px solid var(--night-line);margin-top:10px;padding-top:10px;display:flex;flex-direction:column;gap:6px}
  .bc-day .more button{all:unset;cursor:pointer;font-size:14px;font-weight:700;color:var(--night-text)}
  .bc-head{display:none}
  .bc-wd{margin-bottom:6px}
  .bc-wd div{text-align:center;font-size:12px;font-weight:800;color:var(--mut);letter-spacing:.6px;padding:4px 0}
  .bc-grid{gap:8px !important}
  .bc-cell{min-height:112px;border-radius:12px;background:var(--ground);padding:8px;display:flex;flex-direction:column;gap:5px;cursor:pointer;overflow:hidden;border:2px solid transparent;transition:border-color .12s,background .12s;box-sizing:border-box;min-width:0}
  .bc-cell:hover{border-color:#C9D6C3}
  .bc-cell.has{background:var(--tint)}
  .bc-cell.has-dl{background:var(--warm)}
  .bc-num{font-size:14px;font-weight:800;color:var(--ink);width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:-2px 0 0 -2px}
  .bc-cell.is-today{border-color:var(--ink)}
  .bc-cell.is-today .bc-num{background:var(--night);color:var(--gold)}
  .bc-cell.is-sel{border-color:var(--brand)}
  .bc-ev{border-radius:7px;padding:4px 7px;background:var(--brand);color:#fff;font-size:11px;font-weight:800;line-height:1.25;cursor:grab;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .bc-ev b{font-weight:800}
  .bc-ev small{display:none}
  .bc-ev.inq{background:#fff;color:var(--ink);border:1px dashed #7F9186}
  .bc-ev.ed,.bc-ev.dl{background:var(--gold);color:var(--ink)}
  .bc-ev.dl{cursor:pointer}
  .bc-more{font-size:11px;font-weight:800;color:var(--mut)}
  .bc-dots{display:none}
  .bc-legend{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--mut);margin-top:14px}
  .bc-legend span{display:flex;align-items:center;gap:6px}
  .bc-legend i{width:12px;height:12px;border-radius:3px;background:var(--brand)}
  .bc-legend i.inq{background:#fff;border:1px dashed #7F9186}
  .bc-legend i.ed{background:var(--gold)}

  /* ---- Settings: packages + payments ---- */
  .pk-wrap{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr) minmax(0,300px);gap:20px;align-items:start}
  .pk-list{display:flex;flex-direction:column;gap:12px}
  .pk-item{all:unset;cursor:pointer;box-sizing:border-box;background:var(--ground);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:6px;border:2px solid transparent}
  .pk-item:hover{border-color:#C9D6C3}
  .pk-item.on{background:var(--night);color:var(--night-text)}
  .pk-item .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .pk-item b{font-size:16px;font-weight:800}
  .pk-item .price{font-family:var(--display);font-weight:800;font-size:26px}
  .pk-item small{font-size:13px;color:var(--mut)}
  .pk-item.on small{color:var(--night-mut)}
  .pk-item:focus-visible{outline:3px solid rgba(31,111,71,.35)}
  .pk-edit{display:flex;flex-direction:column;gap:16px;min-width:0}
  .pk-grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:end}
  .pk-grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
  .pk-inc{display:flex;gap:10px;align-items:center}
  .pk-inc .chk{width:28px;height:28px;border-radius:9px;background:var(--tint);color:var(--brand);display:flex;align-items:center;justify-content:center;flex:none}
  .pk-inc input{flex:1;min-width:0}
  .pk-add{all:unset;cursor:pointer;align-self:flex-start;display:inline-flex;align-items:center;gap:8px;padding:12px 16px;border-radius:12px;border:1.5px dashed var(--brand);color:var(--brand);font-weight:800;font-size:14px}
  .pk-add:hover{background:var(--tint)}
  .pk-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:6px}
  .pk-del{all:unset;cursor:pointer;color:var(--danger);font-weight:800;font-size:15px;padding:10px 6px}
  .pk-prev-label{font-size:13px;font-weight:800;color:var(--mut);margin-bottom:8px}
  .pk-prev{background:#fff;border-radius:18px;box-shadow:0 18px 50px rgba(19,34,26,.10);padding:22px;display:flex;flex-direction:column;gap:12px}
  .pk-prev .eyebrow{font-size:11.5px;font-weight:800;color:var(--brand);letter-spacing:.6px;text-transform:uppercase}
  .pk-prev h4{margin:0;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-0.3px;overflow-wrap:anywhere}
  .pk-pills{display:flex;flex-wrap:wrap;gap:6px}
  .pk-pills span{font-size:12px;font-weight:800;padding:5px 9px;border-radius:999px;background:var(--ground)}
  .pk-checks{display:flex;flex-direction:column;gap:6px;font-size:13.5px}
  .pk-checks span::before{content:'✓';color:var(--brand);font-weight:800;margin-right:8px}
  .pk-tot{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid #E8EDE4;padding-top:12px}
  .pk-tot small{font-size:13px;color:var(--mut)}
  .pk-tot b{font-family:var(--display);font-weight:800;font-size:26px}
  @media (max-width:1180px){ .pk-wrap{grid-template-columns:minmax(0,260px) minmax(0,1fr)} .pk-prev-wrap{grid-column:1/-1} }
  @media (max-width:760px){ .pk-wrap{grid-template-columns:1fr} .pk-grid3{grid-template-columns:1fr 1fr} }
  .pm-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:18px}
  .pm-card{background:#fff;border-radius:18px;box-shadow:0 1px 0 var(--line);padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0}
  .pm-card.inset{background:var(--ground);box-shadow:none}
  .pm-card.inset .field input,.pm-card.inset .field select{background:#fff !important}
  .pm-card.inset .qr-drop{background:#fff}
  .pm-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .pm-head b{font-size:17px;font-weight:800}
  .pm-head select{all:unset;cursor:pointer;font-size:17px;font-weight:800}
  .pm-qr-row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  .qr-box{width:136px;height:136px;flex:none;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;box-sizing:border-box;display:flex;align-items:center;justify-content:center}
  .qr-box img{width:100%;height:100%;object-fit:contain;display:block}
  .qr-notes{flex:1;min-width:160px;display:flex;flex-direction:column;gap:8px;font-size:13.5px;color:var(--mut)}
  .qr-notes span::before{content:'✓';color:var(--brand);font-weight:800;margin-right:6px}
  .qr-drop{all:unset;cursor:pointer;box-sizing:border-box;width:100%;min-height:136px;border:2px dashed #C9D6C3;border-radius:16px;background:var(--ground);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--brand);text-align:center;padding:16px}
  .qr-drop b{color:var(--ink);font-size:14px}
  .qr-drop small{color:var(--mut);font-weight:700;font-size:13px}
  .qr-drop:hover{border-color:var(--brand)}
  .pm-add{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:14px 18px;border-radius:14px;border:1.5px dashed var(--brand);color:var(--brand);font-weight:800;font-size:14.5px}
  .pm-add:hover{background:var(--tint)}
  .pm-x{all:unset;cursor:pointer;color:var(--danger);font-weight:800;font-size:13px}
  .remind-preview{white-space:pre-wrap}

  /* ---- reminder modal ---- */
  .field textarea.rm-text{width:100%;min-height:230px;box-sizing:border-box;resize:vertical;line-height:1.55}
  .rm-acts{display:flex;gap:10px;flex-wrap:wrap}
  .rm-acts > *{flex:1 1 140px;justify-content:center}

  /* ---- phone ---- */
  .m-only{display:none}
  .sheet,.sheet-dim{display:none}

    .desk-only,.desk-kpi{display:none !important}

    .tb-in{padding:14px 16px;gap:10px}

    nav.dock,.tb-icon{display:none !important}
    .tb-grow{display:block}
    .tb-search{display:none;position:absolute;left:16px;right:112px;top:12px;flex:none;height:44px;min-width:0}
    .tb-search.m-open{display:flex}
    .tb-results{min-width:0}
    .m-actions{display:flex;gap:10px;align-items:center}
    .m-round{all:unset;cursor:pointer;width:44px;height:44px;border-radius:14px;background:var(--night-in);display:flex;align-items:center;justify-content:center;color:var(--night-text)}
    .m-avatar{all:unset;cursor:pointer;display:flex;border-radius:50%;overflow:hidden}
    .m-avatar .logo-badge,.m-avatar img{width:44px !important;height:44px !important;border-radius:50% !important;background:var(--gold) !important;color:var(--ink) !important;border:0 !important;font-weight:800 !important;font-size:16px !important;object-fit:cover}
    .main{padding:0 16px 120px !important}
    .page-head{padding:8px 16px 30px !important;margin:0 -16px 20px !important;border-radius:0 0 28px 28px;gap:14px 16px;align-items:flex-start !important}
    .page-head.overlap{padding-bottom:30px !important;margin-bottom:20px !important;border-radius:0 0 28px 28px}
    .page-head .page-title{font-size:36px !important;letter-spacing:-1px !important}
    .page-head .page-sub{font-size:14px}
    .page-head > div{min-width:0;max-width:100%}
    .page-actions{width:100%;justify-content:flex-start}
    .page-head .btn-primary,.page-head .btn-ghost,.page-head .btn-telegram,.page-head .btn-line{height:44px !important;font-size:14px !important}
    .band-search{flex:1 1 100%;min-width:0}
    .page-head.hero.overlap{padding-bottom:88px !important;margin-bottom:-66px !important}
    .hero .page-actions{display:none}
    .hero-num{font-size:50px;letter-spacing:-1.6px}
    .hero-eyebrow{font-size:13px}
    .dash-eyebrow{font-size:14px}
    .kpis,.kpis.kpis-3{grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
    .kpi{padding:14px 16px;gap:4px;border-radius:18px}
    .kpi-ic{display:none}
    .kpi-top small,.kpi small{font-size:13px}
    .kpi .v{font-size:24px;letter-spacing:-0.6px}
    .kpi .d{display:none}
    .kpi.night .d{display:block;font-size:12px}
    .kpis.kpis-3 .kpi.night{grid-column:1/-1}
    .dash-cols{gap:16px}
    .dash-side{gap:16px}
    .card{padding:18px !important;border-radius:22px !important}
    .sec-head h2{font-size:20px}
    .row-item{padding:12px 10px;gap:12px}
    .row-item .amt{display:none}
    .date-chip{width:48px}
    .date-chip b{font-size:19px}
    .ri-main b{white-space:normal}
    .kanban-scroll{flex-direction:column !important;overflow:visible !important;gap:18px !important}
    .kanban-col{width:100% !important;flex:none;max-width:none}
    .kanban-col.empty-col{display:none}
    .table-wrap{overflow:visible !important;background:transparent !important;box-shadow:none;padding:0}
    .table-wrap .t-head{display:none !important}
    .table-wrap .t-row{min-width:0 !important;display:flex !important;flex-wrap:wrap;gap:6px 12px;background:#fff;border-radius:18px;padding:14px 16px !important;margin-bottom:10px;box-shadow:0 1px 0 var(--line)}
    .table-wrap .t-row>*{min-width:0}
    .table-wrap .t-row>*:first-child{flex:1 1 100%}
    .pay-row{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:start}
    .pay-row .pay-side{grid-column:1/-1}
    .fchips{flex-wrap:wrap}
    #save-indicator{bottom:96px !important}
    .pay-side{justify-content:space-between;text-align:left;border-top:1px solid #E3E8DF;padding-top:12px}
    .pay-side .num{align-items:flex-start}
    .cl-head{display:none}
    .cl-row{grid-template-columns:minmax(0,1fr) auto;row-gap:6px}
    .cl-row .cnt{display:none}
    .cl-row .tot{grid-column:2;grid-row:1}
    .cl-row .pillcell{grid-column:1/-1}
    .doc-tiles{grid-template-columns:1fr;gap:10px}
    .doc-tile{flex-direction:row;align-items:center;gap:12px;padding:14px}
    .doc-tile .ic{margin:0;flex:none}
    .doc-tile small{display:none}
    .bc{padding:12px !important}
    .bc-grid{gap:3px !important}
    .bc-cell{min-height:0;aspect-ratio:1;border-radius:10px;padding:4px;align-items:center;border-width:1.5px}
    .bc-num{margin:0;font-size:12.5px}
    .bc-ev,.bc-more{display:none}
    .bc-dots{display:flex;gap:3px;margin-top:auto;margin-bottom:2px}
    .bc-dots i{width:5px;height:5px;border-radius:50%;background:var(--brand)}
    .bc-dots i.ed{background:var(--gold)}
    .bc-cell.has.inq-only{background:#fff;border-style:dashed;border-color:#7F9186}
    .bc-cell.has.inq-only.is-today{border-color:var(--ink)}
    .bc-cell.has.inq-only.is-sel{border-color:var(--brand)}
    .bc-dots i.inq{background:#fff;box-shadow:inset 0 0 0 1px #7F9186}
    .bc-wd div{font-size:10.5px;letter-spacing:0}
    .modal-box{padding:22px !important;border-radius:24px !important}
    .modal-title{font-size:22px !important}
    .row-2{flex-wrap:wrap}
    .row-2 > .field{flex:1 1 140px}
    /* floating dark dock */
    .m-tabbar{display:flex;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:80;height:68px;padding:0 6px;background:var(--night);border-radius:22px;justify-content:space-around;align-items:center;box-shadow:0 14px 40px rgba(19,34,26,.35)}
    .tb{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;width:62px;font-size:11px;font-weight:800;color:var(--night-mut)}
    .tb .ico{width:22px;height:22px}
    .tb.on{color:var(--gold)}
    .tb-fab{all:unset;cursor:pointer;width:52px;height:52px;border-radius:16px;background:var(--gold);color:var(--ink);display:flex;align-items:center;justify-content:center;transition:transform .15s}
    .tb-fab.open{transform:rotate(45deg)}
    .qa-dim{display:block;position:fixed;inset:0;z-index:75;background:rgba(19,34,26,.35)}
    .qa-menu{display:flex;position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:90;width:min(320px,calc(100vw - 32px));background:#fff;border-radius:20px;box-shadow:0 18px 50px rgba(19,34,26,.25);padding:6px;flex-direction:column}
    .qa-menu button{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;color:var(--ink)}
    .qa-menu button:hover{background:var(--ground)}
    .qa-menu b{display:block;font-size:14.5px}.qa-menu small{font-size:12.5px;color:var(--mut)}
    .qa-menu .ico{color:var(--brand)}
    .sheet-dim{display:block;position:fixed;inset:0;background:rgba(19,34,26,.4);z-index:78}
    .sheet{display:block;position:fixed;left:0;right:0;bottom:0;z-index:79;background:#fff;border-radius:28px 28px 0 0;padding:10px 18px calc(100px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.15);animation:sheetUp .22s ease}
    @keyframes sheetUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
    .grab{width:40px;height:5px;border-radius:9px;background:#D6DCD3;margin:0 auto 14px}
    .sheet-biz{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:4px 4px 16px}
    .sheet-biz b{display:block;font-size:16px}.sheet-biz small{font-size:13px;color:var(--mut)}
    .sheet-biz .logo-badge,.sheet-biz img{border-radius:50% !important;background:var(--gold) !important;color:var(--ink) !important;border:0 !important}
    .sheet-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .sheet-grid button{all:unset;cursor:pointer;background:var(--ground);border-radius:18px;padding:16px 12px;display:flex;flex-direction:column;gap:10px;font-size:14px;font-weight:800;color:var(--ink)}
    .sheet-grid .ico{color:var(--brand)}
    .main .card[style*="width:280px"]{width:100% !important}
  }
  /* ---- Guided setup ---- */
  .su-backdrop{background:var(--ground,#F7F8F5) !important;backdrop-filter:none !important}
  .su-box{width:min(480px,100%) !important;max-width:480px !important;background:#fff !important;border-radius:24px !important;padding:22px 24px 24px !important;display:flex;flex-direction:column;gap:18px;max-height:calc(100vh - 32px);overflow:auto}
  .su-top{display:grid;grid-template-columns:70px 1fr 70px;align-items:center}
  .su-back{all:unset;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--mut)}
  .su-step{justify-self:end;font-size:12px;color:var(--mut);font-weight:600}
  .su-dots{display:flex;gap:6px;justify-content:center}
  .su-dots span{width:22px;height:4px;border-radius:99px;background:var(--line)}
  .su-dots span.on{background:var(--brand)}
  .su-body{display:flex;flex-direction:column;gap:12px}
  .su-hero{display:flex;justify-content:center;margin:8px 0 4px}
  .su-logo-word{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:34px;letter-spacing:-1px;color:var(--ink)}
  .su-logo-word span{color:var(--brand)}
  .su-done{width:60px;height:60px;border-radius:50%;background:var(--tint);color:var(--brand);display:flex;align-items:center;justify-content:center}
  .su-title{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:700;font-size:24px;letter-spacing:-.5px;margin:0;color:var(--ink)}
  .su-sub{margin:0 0 4px;font-size:14px;line-height:1.55;color:var(--mut)}
  .su-list{display:flex;flex-direction:column;gap:8px}
  .su-choice{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;color:var(--brand);transition:border-color .12s,background .12s}
  .su-choice:hover{border-color:var(--brand)}
  .su-choice.on{border-color:var(--brand);background:var(--tint)}
  .su-choice span{flex:1;min-width:0}
  .su-choice b{display:block;font-size:14.5px;color:var(--ink);font-weight:600}
  .su-choice small{display:block;font-size:12.5px;color:var(--mut);margin-top:2px}
  .su-check{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;color:#fff}
  .su-choice.on .su-check{background:var(--brand);border-color:var(--brand)}
  .su-choice:focus-visible{outline:3px solid rgba(31,111,71,.3);outline-offset:2px}
  .su-logo{display:flex;align-items:center;gap:12px}
  .su-logo img,.su-logo span{width:48px;height:48px;border-radius:12px;object-fit:contain;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--mut);background:var(--ground)}
  .su-body .field{margin:0}
  .su-err{font-size:13px;font-weight:600;color:var(--danger)}
  .su-next{box-sizing:border-box !important;justify-content:center !important;width:100%;padding:14px 16px !important;font-size:15px !important;border-radius:14px !important}
  .su-next[disabled]{opacity:.4;cursor:default}
  .su-final{display:flex;flex-direction:column;gap:8px}
  .su-final .btn-ghost{border:1px solid var(--line);background:#fff;font-weight:600}
  .su-tags{display:flex;flex-wrap:wrap;gap:6px}
  .su-tags span{font-size:13px;font-weight:600;padding:6px 12px;border-radius:99px;background:var(--tint);color:var(--brand-deep)}
  @media (max-width:760px){.su-backdrop{align-items:stretch !important;padding:0 !important}.su-box{border-radius:0 !important;max-height:none;min-height:100vh;padding:18px 18px 28px !important}.su-box .su-next{margin-top:auto}}

  /* ---- Home checklist ---- */
  .chk{background:#fff;border:0;box-shadow:0 1px 0 var(--line);border-radius:18px;padding:20px 22px 12px;margin-bottom:24px}
  .chk-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .chk-head h2{margin:0;font-family:var(--display);font-size:20px;font-weight:700;color:var(--ink)}
  .chk-head small{font-size:12.5px;color:var(--mut)}
  .chk-bar{height:5px;border-radius:99px;background:var(--line);overflow:hidden;margin:12px 0 6px}
  .chk-bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
  .chk-item{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;width:100%;padding:11px 2px;border-top:1px solid var(--line);font-size:14px;color:var(--ink)}
  .chk-item:first-of-type{border-top:0}
  .chk-item i{flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;color:#fff}
  .chk-item.done{cursor:default;color:var(--mut);text-decoration:line-through}
  .chk-item.done i{background:var(--brand);border-color:var(--brand)}
  .chk-item:not(.done):hover span{color:var(--brand)}
  .chk-done-p{font-size:14px;line-height:1.5;color:var(--mut);margin:10px 0 14px}.chk-done-btn{width:100%;margin-bottom:10px}.chk-sample{font-size:13px;color:var(--mut);background:var(--tint);border-radius:12px;padding:10px 12px;margin:6px 0 8px}

  @media (max-width:760px){
    :root{--display:'Eksakto Peso','Manrope',system-ui,sans-serif;--body:'Eksakto Peso','Manrope',system-ui,sans-serif;--p-bg:#F6F7F5;--p-line:#ECEEEA;--p-line2:#E3E6E1;--p-mut:#8A948D;--p-mut2:#5E6B63;--p-green:#2E8B57;--p-red:#D23B2E;--p-track:#ECEEEA}
    .hero-num,.kpi .v{font-family:'Eksakto Peso','Bricolage Grotesque','Manrope',system-ui,sans-serif !important}
    body{background:var(--p-bg);font-family:var(--body);font-synthesis:none}
    .card-title,.su-title,.sec-head h2,.chk-head h2,.modal-title,.page-title,.sg{font-family:var(--display) !important}
    b,strong,h3{font-weight:600}
    [style*="font-weight:800"]{font-weight:600 !important}
    .main{background:var(--p-bg)}
    /* top bar: greeting instead of the logo, round white buttons */
    .topbar{background:var(--p-bg);color:var(--ink)}
    .tb-logo{display:none !important}
    .tb-greet{display:flex;flex-direction:column;line-height:1.2;min-width:0}

    .m-round{background:#fff;color:var(--ink);width:40px;height:40px;border-radius:999px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
